name: webcuatuici

on:
  push:
    branches: [master]

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (key auth, unprivileged app user)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: flashvps
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # SHA256 fingerprint of the server's ECDSA host key, the type the Go SSH client negotiates
          # first (pins the host, blocks MITM)
          fingerprint: SHA256:5MDFMb0PnCHtLYMkm2EhvnF401+klFOygCJLlxlQA7k
          port: 22
          script_stop: true
          script: |
            cd /home/flashvps/toilamerp.com
            git fetch origin master
            git reset --hard origin/master
            composer install --no-interaction --no-progress
            npm install --no-fund --no-audit
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
            php artisan filament:optimize-clear
            php artisan filament:optimize
            php artisan app:generate-sitemap
            php artisan optimize
            php artisan queue:restart
